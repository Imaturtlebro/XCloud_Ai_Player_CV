name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc

      - name: Build
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE"
          pwd
          ls -la
          {
            echo '### trigger.c'
            gcc -O2 -Wall -Wextra -o trigger.exe trigger.c -lgdi32 -luser32 2>&1
            echo "trigger.c exit=$?"
            echo '### picker.c'
            gcc -O2 -Wall -Wextra -o picker.exe picker.c -lgdi32 -luser32 2>&1
            echo "picker.c exit=$?"
          } | tee build-warnings.txt

      - name: Strip
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE"
          strip --strip-unneeded trigger.exe || true
          strip --strip-unneeded picker.exe  || true

      - name: Build report
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE"
          {
            echo "# Build report"
            echo
            echo "- commit: ${GITHUB_SHA}"
            echo "- run:    ${GITHUB_RUN_ID}"
            echo "- built:  $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- gcc:    $(gcc -dumpversion)"
            echo "- trigger.exe: $(stat -c%s trigger.exe) bytes"
            echo "- picker.exe:  $(stat -c%s picker.exe) bytes"
            echo
            echo '## Compiler output'
            echo '```'
            cat build-warnings.txt
            echo '```'
            echo
            echo '## Section sizes'
            echo '```'
            size trigger.exe picker.exe || true
            echo '```'
          } > build-report.txt
          cat build-report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: win64-binaries
          path: |
            trigger.exe
            picker.exe
          if-no-files-found: error

      # Two traps this step has to avoid:
      #
      # 1. Committing back to main re-triggers this workflow, and
      #    build-report.txt embeds the SHA so it always differs -- that
      #    would loop forever. Check HEAD's author before doing anything.
      # 2. main advances while this job runs, so a plain push is rejected
      #    as non-fast-forward. Rebase onto origin/main and retry.
      #
      # Also fails loudly on the final attempt: the earlier version had the
      # retry loop swallow the exit status, so a rejected push still
      # reported success.
      - name: Commit binaries and report back to main
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE"
          if git log -1 --format='%an' | grep -q 'github-actions'; then
            echo "HEAD is a bot build commit; not pushing again."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q main.c 2>/dev/null || echo "main.c already gone"
          git add -f trigger.exe picker.exe build-report.txt build-warnings.txt
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -q -m "build: binaries from ${GITHUB_SHA}"
          ok=1
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git rebase origin/main >/dev/null 2>&1 || true
            if git push origin HEAD:main; then ok=0; break; fi
            echo "push attempt $i rejected, rebasing and retrying"
            sleep 5
          done
          if [ "$ok" -ne 0 ]; then
            echo "::error::could not push build artefacts to main"
            exit 1
          fi
          echo "pushed build artefacts"
