name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc

      # The msys2 shell does not reliably start in $GITHUB_WORKSPACE, and a
      # wrong working directory makes gcc fail with "main.c: No such file".
      # cd explicitly in every step rather than relying on the default.
      - name: Build
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE"
          pwd
          ls -la
          gcc -O2 -Wall -Wextra -o trigger.exe main.c -lgdi32 -luser32 2> build-warnings.txt
          cat build-warnings.txt
          ls -l trigger.exe

      - name: Strip
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE"
          strip --strip-unneeded trigger.exe || true

      - name: Build report
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE"
          {
            echo "# Build report"
            echo
            echo "- commit: ${GITHUB_SHA}"
            echo "- run:    ${GITHUB_RUN_ID}"
            echo "- built:  $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- gcc:    $(gcc -dumpversion)"
            echo "- binary: $(stat -c%s trigger.exe) bytes"
            echo
            echo '## Compiler warnings'
            echo '```'
            cat build-warnings.txt
            echo '```'
            echo
            echo '## Section sizes'
            echo '```'
            size trigger.exe || true
            echo '```'
          } > build-report.txt
          cat build-report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: trigger-win64
          path: trigger.exe
          if-no-files-found: error

      # Committing back to main re-triggers this workflow. build-report.txt
      # embeds the SHA, so it always differs and would loop forever. This
      # guard makes exactly one round trip: if the commit we are building
      # was itself a bot build, stop here and let the run end.
      - name: Commit binary and report back to main
        continue-on-error: true
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE"
          if git log -1 --format='%an' | grep -q 'github-actions'; then
            echo "HEAD is a bot build commit; not pushing again."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f trigger.exe
          git add -f build-report.txt build-warnings.txt
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "build: trigger.exe from ${GITHUB_SHA}"
            for i in 1 2 3; do
              git push origin HEAD:main && break
              echo "push attempt $i failed, retrying"
              sleep 5
            done
          fi
