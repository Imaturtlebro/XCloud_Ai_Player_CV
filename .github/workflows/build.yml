name: build

# Builds both binaries on every push to main and attaches them as the
# `win64-binaries` artifact.
#
# Artefacts are attached rather than committed back to main on purpose:
# committing to main re-triggers this workflow, and any report file that
# embeds the SHA always differs, so that loops forever. Downloading the
# artifact needs a token with actions:read -- see the README.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc

      # cd explicitly: the msys2 shell does not reliably start in
      # $GITHUB_WORKSPACE, and gcc then fails with "no such file".
      - name: Build
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE"
          {
            echo '### trigger.c'
            gcc -O2 -Wall -Wextra -o trigger.exe trigger.c -lgdi32 -luser32 2>&1
            echo "trigger.c exit=$?"
            echo '### picker.c'
            gcc -O2 -Wall -Wextra -o picker.exe picker.c -lgdi32 -luser32 2>&1
            echo "picker.c exit=$?"
          } | tee build-warnings.txt

      - name: Smoke test
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE"
          ./trigger.exe --help
          ./trigger.exe --color FF3355 --radius 25 --save-config ci-test.cfg
          cat ci-test.cfg
          rm -f ci-test.cfg

      - name: Strip
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE"
          strip --strip-unneeded trigger.exe || true
          strip --strip-unneeded picker.exe  || true

      - name: Sizes
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE"
          size trigger.exe picker.exe

      - uses: actions/upload-artifact@v4
        with:
          name: win64-binaries
          path: |
            trigger.exe
            picker.exe
            build-warnings.txt
          if-no-files-found: error
