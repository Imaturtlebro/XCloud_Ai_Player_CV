name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Build
        shell: msys2 {0}
        run: |
          gcc -O2 -Wall -Wextra -o trigger.exe main.c -lgdi32 -luser32
          ls -l trigger.exe

      - name: Strip
        shell: msys2 {0}
        run: strip -x trigger.exe || true

      - name: Section sizes
        shell: msys2 {0}
        run: size trigger.exe || true

      - uses: actions/upload-artifact@v4
        with:
          name: trigger-win64
          path: trigger.exe
          if-no-files-found: error
